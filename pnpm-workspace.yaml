packages:
  - web
  - mobile
  - packages/*
allowBuilds:
  unrs-resolver: true
overrides:
  '@scenariom/i18n': link:packages/i18n
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'compression@<1.8.2': 1.8.2
  'decode-uri-component@<0.5.0': 0.5.0
  lightningcss: 1.30.1
  'uuid@<11.1.1': 11.1.1
nodeLinker: hoisted
verifyDepsBeforeRun: false
update:
  # Expo SDK dictates compatible versions for these packages. They must be
  # upgraded together through `pnpm expo:sync`, never by a generic update.
  ignoreDeps:
    - expo
    - expo-*
    - '@expo/*'
    - react
    - react-dom
    - react-native
    - react-native-*
    - '@react-native/*'
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.23'
  - '@expo/metro-file-map@57.0.3'
  - babel-preset-expo@57.0.11
  - expo-modules-core@57.0.17
  - expo-modules-jsi@57.1.0
  - expo@57.0.21
  - '@expo/ui@57.0.17'
  - expo-glass-effect@57.0.2
  - expo-router@57.0.20
